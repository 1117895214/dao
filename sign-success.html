<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>签到成功｜天道·论道雅集</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;
      background:#0c0c0c;
      color:#e6c26e;
      font-family:"KaiTi",楷体,serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:20px;
      background-image: radial-gradient(#221a0f,#000);
    }
    .box{
      text-align:center;
      border:1px solid #8c6d2f80;
      padding:48px 32px;
      border-radius:16px;
      background:rgba(20,16,8,0.65);
      box-shadow:0 0 30px #d4a04640;
    }
    .taiji{
      font-size:60px;
      margin-bottom:24px;
    }
    h1{
      font-size:28px;
      margin-bottom:16px;
      color:#f0c870;
    }
    .name{
      font-size:22px;
      margin:12px 0;
      color:#fff;
    }
    p{
      font-size:17px;
      line-height:1.8;
      color:#d4bd8c;
    }
    .footer-text{
      margin-top:32px;
      font-size:16px;
      color:#b89c5c;
    }
  </style>
</head>
<body>
<div class="box">
  <div class="taiji">☯</div>
  <h1>签到成功</h1>
  <p>道友：<span class="name">______</span></p>
  <p>已登记入席，静候开坛论道</p>
  <div class="footer-text">
    道法自然 · 天人合一<br>
    天道·论道雅集
  </div>
</div>
<script>
// 读取url参数 ?name=道友名
const params = new URLSearchParams(location.search);
const userName = params.get('name') || "道友";
document.querySelector('.name').innerText = userName;
</script>
</body>
</html>
